[package]
name = "app"
description = "The HandOver desktop app: a Tauri 2 window around the core crate and the UI in ../ui."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "handover"
path = "src/main.rs"

[features]
# Serve the built UI from ../ui/dist inside the binary. The Tauri CLI turns this on for
# `tauri build`; turn it on by hand to `cargo run` the app without the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
handover-core = { path = "../core" }
tauri = { version = "2.11.5", features = [] }
serde_json = "1.0.145"
# Lesson complete and checks-off notices while the window is in the background.
tauri-plugin-notification = "2.3.3"
# The native file picker for "Choose a File" in Teach.
rfd = { version = "0.15.4", default-features = false, features = ["gtk3"] }
