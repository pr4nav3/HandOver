[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Soham Aggarwal"]
rust-version = "1.85"

[profile.release]
# Small, fast binary: one codegen unit, link-time optimization, no unwinding tables to ship.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
