# xcodegen spec for the HandOver iPhone camera app.
# Compiles with Xcode on macOS against MWDAT 1.0.1; not yet run on a device. See README.md.
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open HandOverCamera.xcodeproj
#
# Fallback without the glasses toolkit: see README.md "Building without the glasses toolkit".

name: HandOverCamera

options:
  bundleIdPrefix: com.handover
  deploymentTarget:
    iOS: "17.2"

settings:
  base:
    SWIFT_VERSION: "5.0"

packages:
  # Meta Wearables Device Access Toolkit (iOS). Needs Xcode 26.4+ (Swift 6.3 tools).
  # To build without it, delete this block and the two "package:" dependency lines below.
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: 1.0.1

targets:
  HandOverCamera:
    type: application
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - path: Sources
        # To drop the glasses source file, uncomment the next line AND add
        # HANDOVER_NO_GLASSES to SWIFT_ACTIVE_COMPILATION_CONDITIONS below.
        # excludes: ["GlassesCameraSource.swift"]
    dependencies:
      - package: MWDAT
        product: MWDATCore      # product name confirmed in the 1.0.1 Package.swift
      - package: MWDAT
        product: MWDATCamera    # product name confirmed in the 1.0.1 Package.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.handover.camera
        PRODUCT_NAME: HandOverCamera
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        # Change to "$(inherited) HANDOVER_NO_GLASSES" to compile the glasses file out
        # (stub in FrameSource.swift). $(inherited) keeps DEBUG in the Debug config.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
    info:
      # xcodegen writes this file on every `xcodegen generate`; edit the properties here, not the file.
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: HandOver
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "HandOver sends about two camera frames per second to the HandOver hub on your laptop so it can check each step."
        NSLocalNetworkUsageDescription: "HandOver connects to the HandOver hub on your local network and to your Meta glasses."
        NSBluetoothAlwaysUsageDescription: "HandOver uses Bluetooth to stream the camera of your Meta glasses."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Keys the Meta Wearables toolkit needs (from the CameraAccess sample notes).
        NSBonjourServices:
          - _bonjour._tcp
        UIBackgroundModes:
          - bluetooth-central
        CFBundleURLTypes:
          - CFBundleURLName: com.handover.camera
            CFBundleURLSchemes:
              - handovercamera
        MWDAT:
          # AppLinkURLScheme is a key the 1.0.1 toolkit binary reads. The MWDAT dictionary name follows
          # the CameraAccess sample; not yet confirmed on a device.
          AppLinkURLScheme: "handovercamera://"
